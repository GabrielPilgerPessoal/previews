  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

rc: url(\"d5383a97-629b-46fb-ba74-67028259fed0\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'IBM Plex Sans';\n  font-style: normal;\n  font-weight: 600;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"46300da3-1944-490e-8213-3a9ccaaf6ec2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  body { margin: 0; }\n  doc-page:not(:defined) { visibility: hidden; }\n  a { color: #0E74B8; text-decoration: none; }\n  a:hover { color: #16243C; }\n<\u002Fstyle>\n<script src=\"cf5c876f-2f76-4cd1-b8a1-42db48a8971b\"><\u002Fscript>\n<\u002Fhelmet>\n\n<doc-page margin=\"0.7in\">\n\n  <div slot=\"header\" style=\"display:flex; align-items:center; justify-content:space-between; padding-bottom:8px; border-bottom:1px solid #E2E8EE; font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.12em; text-transform:uppercase; color:#8794A1;\">\n    <span>Hidro · Manual de Marca<\u002Fspan>\n    <span>Digital · v1.0 · 2026<\u002Fspan>\n  <\u002Fdiv>\n\n  <div slot=\"footer\" style=\"display:flex; align-items:center; justify-content:space-between; padding-top:8px; border-top:1px solid #E2E8EE; font-family:'IBM Plex Mono',monospace; font-size:9px; letter-spacing:0.1em; color:#8794A1;\">\n    <span>hidrodistribuidora.com.br<\u002Fspan>\n    <span>Concórdia · SC<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"font-family:'IBM Plex Sans',system-ui,sans-serif; color:#484850;\">\n\n    <!-- CAPA -->\n    <div style=\"background:#16243C; margin:18px 0 0; border-radius:28px; padding:64px 48px 56px; display:flex; flex-direction:column; gap:40px; break-inside:avoid;\">\n      <img src=\"feb5b5ae-3e56-4ce0-91cf-b3bb49474ee4\" alt=\"Hidro\" style=\"width:300px; height:auto; filter:brightness(0) invert(1);\">\n      <div style=\"display:flex; flex-direction:column; gap:14px;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.18em; text-transform:uppercase; color:#00B0F0;\">Especialistas em material hidráulico · identidade digital<\u002Fdiv>\n        <h1 style=\"margin:0; font-family:Archivo,sans-serif; font-weight:800; font-size:52px; line-height:0.98; letter-spacing:-0.03em; color:#ffffff;\">Manual de Marca<\u002Fh1>\n        <p style=\"margin:0; max-width:34em; font-size:15px; line-height:1.6; color:#B6C6D6;\">Como a Hidro se apresenta em tela: site, e-commerce, WhatsApp, redes e anúncios. Documento vivo: atualize a versão sempre que um padrão mudar.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:10px; margin-top:8px;\">\n        <span style=\"height:6px; width:120px; border-radius:999px; background:#00B0F0;\"><\u002Fspan>\n        <span style=\"height:6px; width:60px; border-radius:999px; background:#0E74B8;\"><\u002Fspan>\n        <span style=\"height:6px; width:30px; border-radius:999px; background:#384888;\"><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- SUMÁRIO -->\n    <div style=\"padding:36px 0 8px;\">\n      <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:#8794A1; margin-bottom:14px;\">Conteúdo<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:8px 40px; font-size:14px;\">\n        <div style=\"display:flex; gap:12px; border-bottom:1px solid #EDF1F5; padding-bottom:6px;\"><span style=\"font-family:'IBM Plex Mono',monospace; color:#0E74B8;\">01<\u002Fspan><span>A marca<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:12px; border-bottom:1px solid #EDF1F5; padding-bottom:6px;\"><span style=\"font-family:'IBM Plex Mono',monospace; color:#0E74B8;\">02<\u002Fspan><span>Tom de voz<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:12px; border-bottom:1px solid #EDF1F5; padding-bottom:6px;\"><span style=\"font-family:'IBM Plex Mono',monospace; color:#0E74B8;\">03<\u002Fspan><span>Logo: versões<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:12px; border-bottom:1px solid #EDF1F5; padding-bottom:6px;\"><span style=\"font-family:'IBM Plex Mono',monospace; color:#0E74B8;\">04<\u002Fspan><span>Logo: uso correto<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:12px; border-bottom:1px solid #EDF1F5; padding-bottom:6px;\"><span style=\"font-family:'IBM Plex Mono',monospace; color:#0E74B8;\">05<\u002Fspan><span>Cor<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:12px; border-bottom:1px solid #EDF1F5; padding-bottom:6px;\"><span style=\"font-family:'IBM Plex Mono',monospace; color:#0E74B8;\">06<\u002Fspan><span>Contraste e acessibilidade<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:12px; border-bottom:1px solid #EDF1F5; padding-bottom:6px;\"><span style=\"font-family:'IBM Plex Mono',monospace; color:#0E74B8;\">07<\u002Fspan><span>Tipografia<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:12px; border-bottom:1px solid #EDF1F5; padding-bottom:6px;\"><span style=\"font-family:'IBM Plex Mono',monospace; color:#0E74B8;\">08<\u002Fspan><span>Componentes de UI<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:12px; border-bottom:1px solid #EDF1F5; padding-bottom:6px;\"><span style=\"font-family:'IBM Plex Mono',monospace; color:#0E74B8;\">09<\u002Fspan><span>Fotografia e ícones<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:12px; border-bottom:1px solid #EDF1F5; padding-bottom:6px;\"><span style=\"font-family:'IBM Plex Mono',monospace; color:#0E74B8;\">10<\u002Fspan><span>Governança<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 01 A MARCA -->\n    <div style=\"break-before:page; padding-top:24px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; border-top:2px solid #16243C; padding-top:12px; margin-bottom:20px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#0E74B8;\">01<\u002Fspan>\n        <h2 style=\"margin:0; font-family:Archivo,sans-serif; font-weight:700; font-size:28px; letter-spacing:-0.02em; color:#16243C;\">A marca<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 18px; font-size:15px; line-height:1.65; max-width:40em;\">Especialistas em material hidráulico, em Concórdia (SC), atendendo Santa Catarina, Paraná e Rio Grande do Sul. Mais de 9 mil itens em estoque, do reparo simples ao projeto de grande obra. Atendemos quem instala, quem constrói, quem revende e também quem está resolvendo a própria casa. Todos decidem por disponibilidade, prazo e preço, nessa ordem.<\u002Fp>\n      <div style=\"display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:20px;\">\n        <div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:16px; break-inside:avoid;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#8794A1; margin-bottom:8px;\">Promessa<\u002Fdiv>\n          <div style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:19px; color:#16243C; line-height:1.2;\">Precisou, encontrou.<\u002Fdiv>\n          <p style=\"margin:8px 0 0; font-size:13.5px; line-height:1.55;\">Variedade e rapidez são o argumento central. Tudo no digital deve reduzir o caminho entre procurar e receber o preço.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:16px; break-inside:avoid;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#8794A1; margin-bottom:8px;\">Posicionamento<\u002Fdiv>\n          <div style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:19px; color:#16243C; line-height:1.2;\">Especialistas em material hidráulico<\u002Fdiv>\n          <p style=\"margin:8px 0 0; font-size:13.5px; line-height:1.55;\">Não é marketplace nem depósito genérico: é o estoque perto, com gente que entende de hidráulica e atende profissional e cliente final com o mesmo cuidado.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:12px;\">\n        <div style=\"background:#EDF1F5; padding:14px; border-radius:16px; break-inside:avoid;\"><div style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:15px; color:#16243C; margin-bottom:5px;\">Clareza antes de charme<\u002Fdiv><p style=\"margin:0; font-size:13px; line-height:1.5;\">Preço, prazo e código visíveis sem cliques extras.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#EDF1F5; padding:14px; border-radius:16px; break-inside:avoid;\"><div style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:15px; color:#16243C; margin-bottom:5px;\">Escala visível<\u002Fdiv><p style=\"margin:0; font-size:13px; line-height:1.5;\">Números concretos: 9 mil itens, 3 estados, entrega própria.<\u002Fp><\u002Fdiv>\n        <div style=\"background:#EDF1F5; padding:14px; border-radius:16px; break-inside:avoid;\"><div style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:15px; color:#16243C; margin-bottom:5px;\">Resposta rápida<\u002Fdiv><p style=\"margin:0; font-size:13px; line-height:1.5;\">Todo canal digital termina em uma cotação ou um contato humano.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:20px; border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:18px; break-inside:avoid;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#8794A1; margin-bottom:12px;\">Nome e assinatura descritiva<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px;\">\n          <div><div style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:22px; letter-spacing:-0.02em; color:#16243C; margin-bottom:6px;\">Hidro<\u002Fdiv><p style=\"margin:0; font-size:13px; line-height:1.55;\">Nome de uso em tudo que é falado e escrito no dia a dia: posts, anúncios, atendimento, site. É assim que o cliente já chama.<\u002Fp><\u002Fdiv>\n          <div><div style=\"font-family:Archivo,sans-serif; font-weight:600; font-size:15px; color:#0E74B8; margin-bottom:6px;\">Hidro · especialistas em material hidráulico<\u002Fdiv><p style=\"margin:0; font-size:13px; line-height:1.55;\">Assinatura descritiva. Entra quando o público não conhece a marca: bio de rede, anúncio, primeira tela do site, rodapé de e-mail.<\u002Fp><\u002Fdiv>\n          <div><div style=\"font-family:Archivo,sans-serif; font-weight:600; font-size:15px; color:#6B7785; margin-bottom:6px;\">Hidro Distribuidora Ltda.<\u002Fdiv><p style=\"margin:0; font-size:13px; line-height:1.55;\">Só em contexto legal: nota fiscal, contrato, cadastro, dados da empresa. Nunca como título de peça.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:12px 0 0; font-size:13px; line-height:1.55; color:#6B7785;\">A palavra <strong style=\"color:#16243C;\">atacado<\u002Fstrong> sai da comunicação: ela exclui o cliente final, que também compra aqui. Quando precisar falar de volume, fale de condição: “quanto maior o pedido, melhor a condição”.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 02 TOM DE VOZ -->\n    <div style=\"padding-top:34px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; border-top:2px solid #16243C; padding-top:12px; margin-bottom:20px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#0E74B8;\">02<\u002Fspan>\n        <h2 style=\"margin:0; font-family:Archivo,sans-serif; font-weight:700; font-size:28px; letter-spacing:-0.02em; color:#16243C;\">Tom de voz<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 16px; font-size:15px; line-height:1.65; max-width:40em;\">Direto, técnico e cordial, como um balconista experiente. Frases curtas, verbo na frente, nada de superlativo vazio. Chame o cliente pelo nome sempre que souber, em vez de “senhor” ou de tratamento genérico. Termo técnico sempre com a medida junto (25mm, 3/4\", 1000L).<\u002Fp>\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px;\">\n        <div style=\"border-left:3px solid #0E74B8; padding:4px 0 4px 14px; break-inside:avoid;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#0E74B8; margin-bottom:8px;\">Escreva assim<\u002Fdiv>\n          <p style=\"margin:0 0 6px; font-size:14px; line-height:1.5;\">“Tubo soldável 25mm em estoque. Cotação em até 2 horas úteis.”<\u002Fp>\n          <p style=\"margin:0 0 6px; font-size:14px; line-height:1.5;\">“Somos especialistas em material hidráulico. Entregamos em SC, PR e RS.”<\u002Fp>\n          <p style=\"margin:0; font-size:14px; line-height:1.5;\">“Manda a lista no WhatsApp que a gente cota.”<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border-left:3px solid #C9D2DB; padding:4px 0 4px 14px; break-inside:avoid;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#8794A1; margin-bottom:8px;\">Evite<\u002Fdiv>\n          <p style=\"margin:0 0 6px; font-size:14px; line-height:1.5; color:#8794A1;\">“A solução completa em soluções hidráulicas!”<\u002Fp>\n          <p style=\"margin:0 0 6px; font-size:14px; line-height:1.5; color:#8794A1;\">“Os MELHORES preços do mercado!!!” (caixa alta e excesso de exclamação)<\u002Fp>\n          <p style=\"margin:0 0 6px; font-size:14px; line-height:1.5; color:#8794A1;\">“Atacado de material hidráulico”: o termo exclui o cliente final.<\u002Fp>\n          <p style=\"margin:0; font-size:14px; line-height:1.5; color:#8794A1;\">Emoji como substituto de informação.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 03 LOGO VERSÕES -->\n    <div style=\"break-before:page; padding-top:24px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; border-top:2px solid #16243C; padding-top:12px; margin-bottom:20px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#0E74B8;\">03<\u002Fspan>\n        <h2 style=\"margin:0; font-family:Archivo,sans-serif; font-weight:700; font-size:28px; letter-spacing:-0.02em; color:#16243C;\">Logo: versões<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 18px; font-size:15px; line-height:1.65; max-width:40em;\">A marca permanece como está. O que muda é o repertório digital: além da versão em degradê, passam a existir versões planas (uma cor) para telas pequenas, fundos escuros e aplicações de baixa resolução: avatar, favicon e marca d'água em foto.<\u002Fp>\n\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;\">\n        <div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; break-inside:avoid;\">\n          <div style=\"background:#FFFFFF; padding:26px 22px; display:flex; align-items:center; justify-content:center; min-height:90px;\"><img src=\"feb5b5ae-3e56-4ce0-91cf-b3bb49474ee4\" alt=\"\" style=\"width:190px; height:auto;\"><\u002Fdiv>\n          <div style=\"border-top:1px solid #E2E8EE; padding:10px 12px;\"><div style=\"font-family:Archivo,sans-serif; font-weight:600; font-size:13.5px; color:#16243C;\">Principal (degradê)<\u002Fdiv><div style=\"font-size:12.5px; color:#6B7785; line-height:1.45;\">Fundo claro, tamanho médio ou grande. Site, apresentações, e-mail.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; break-inside:avoid;\">\n          <div style=\"background:#16243C; padding:26px 22px; display:flex; align-items:center; justify-content:center; min-height:90px;\"><img src=\"feb5b5ae-3e56-4ce0-91cf-b3bb49474ee4\" alt=\"\" style=\"width:190px; height:auto; filter:brightness(0) invert(1);\"><\u002Fdiv>\n          <div style=\"border-top:1px solid #E2E8EE; padding:10px 12px;\"><div style=\"font-family:Archivo,sans-serif; font-weight:600; font-size:13.5px; color:#16243C;\">Negativa (branco sólido)<\u002Fdiv><div style=\"font-size:12.5px; color:#6B7785; line-height:1.45;\">Fundo escuro, foto, vídeo. Uma cor só, sem degradê no negativo.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; break-inside:avoid;\">\n          <div style=\"background:#FFFFFF; padding:26px 22px; display:flex; align-items:center; justify-content:center; min-height:90px;\"><img src=\"feb5b5ae-3e56-4ce0-91cf-b3bb49474ee4\" alt=\"\" style=\"width:190px; height:auto; filter:grayscale(1) brightness(0.35);\"><\u002Fdiv>\n          <div style=\"border-top:1px solid #E2E8EE; padding:10px 12px;\"><div style=\"font-family:Archivo,sans-serif; font-weight:600; font-size:13.5px; color:#16243C;\">Monocromática<\u002Fdiv><div style=\"font-size:12.5px; color:#6B7785; line-height:1.45;\">Documento fiscal, carimbo, fax de pedido, impressão a uma cor.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; break-inside:avoid;\">\n          <div style=\"background:#EDF1F5; padding:22px; display:flex; align-items:center; justify-content:center; gap:16px; min-height:90px;\">\n            \n            <div style=\"width:64px; height:64px; border-radius:50%; background:#16243C; overflow:hidden; display:flex; align-items:center; justify-content:center;\"><div style=\"width:49px; height:21px; overflow:hidden; position:relative;\"><img src=\"feb5b5ae-3e56-4ce0-91cf-b3bb49474ee4\" alt=\"\" style=\"position: absolute; width: 122px; height: 27px; left: 1px; top: 2px; filter: brightness(0) invert(1)\"><\u002Fdiv><\u002Fdiv><div style=\"width:40px; height:40px; border-radius:12px; background:#0E74B8; display:flex; align-items:center; justify-content:center; font-family:Archivo,sans-serif; font-weight:800; font-size:22px; color:#fff;\">H<\u002Fdiv>\n            <div style=\"width:22px; height:22px; border-radius:7px; background:#0E74B8; display:flex; align-items:center; justify-content:center; font-family:Archivo,sans-serif; font-weight:800; font-size:13px; color:#fff;\">H<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #E2E8EE; padding:10px 12px;\"><div style=\"font-family:Archivo,sans-serif; font-weight:600; font-size:13.5px; color:#16243C;\">Avatar e favicon<\u002Fdiv><div style=\"font-size:12.5px; color:#6B7785; line-height:1.45;\">Abaixo de 64px a assinatura completa não se lê: use a onda recortada ou o “H” em Archivo 800 sobre Azul Hidro.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background:#EDF1F5; padding:16px; border-radius:16px; display:flex; gap:18px; break-inside:avoid;\">\n        <div style=\"flex:1;\"><div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#8794A1; margin-bottom:6px;\">Arquivos a produzir<\u002Fdiv><p style=\"margin:0; font-size:13px; line-height:1.55;\">SVG (web, obrigatório), PNG com fundo transparente em 3 larguras (400/800/1600px), versão negativa e monocromática, favicon .ico + PNG 512px, avatar quadrado 1080px.<\u002Fp><\u002Fdiv>\n        <div style=\"flex:1;\"><div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#8794A1; margin-bottom:6px;\">Nomenclatura<\u002Fdiv><p style=\"margin:0; font-family:'IBM Plex Mono',monospace; font-size:12px; line-height:1.7; color:#16243C;\">hidro-logo-principal.svg<br>hidro-logo-negativo.svg<br>hidro-simbolo-avatar-1080.png<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 04 LOGO USO -->\n    <div style=\"padding-top:34px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; border-top:2px solid #16243C; padding-top:12px; margin-bottom:20px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#0E74B8;\">04<\u002Fspan>\n        <h2 style=\"margin:0; font-family:Archivo,sans-serif; font-weight:700; font-size:28px; letter-spacing:-0.02em; color:#16243C;\">Logo: área de respiro, tamanhos e usos incorretos<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:1.2fr 1fr; gap:16px; margin-bottom:18px;\">\n        <div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:16px; break-inside:avoid;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#8794A1; margin-bottom:10px;\">Área de respiro = altura do “H”<\u002Fdiv>\n          <div style=\"background:repeating-linear-gradient(135deg,#F4F7FA 0 6px,#EAEFF4 6px 12px); border-radius:16px; padding:34px; display:flex; align-items:center; justify-content:center;\">\n            <div style=\"background:#fff; padding:8px;\"><img src=\"feb5b5ae-3e56-4ce0-91cf-b3bb49474ee4\" alt=\"\" style=\"width:170px; height:auto; display:block;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:10px 0 0; font-size:13px; line-height:1.55;\">Nenhum texto, botão ou borda dentro da faixa hachurada. Em header de site, isso significa no mínimo 24px livres de cada lado.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:16px; break-inside:avoid;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#8794A1; margin-bottom:10px;\">Tamanhos mínimos<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:9px; font-size:13.5px;\">\n            <div style=\"display:flex; justify-content:space-between; border-bottom:1px solid #EDF1F5; padding-bottom:6px;\"><span>Header desktop<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#16243C;\">160 px<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; border-bottom:1px solid #EDF1F5; padding-bottom:6px;\"><span>Header mobile<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#16243C;\">120 px<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between; border-bottom:1px solid #EDF1F5; padding-bottom:6px;\"><span>Assinatura completa (mín.)<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#16243C;\">96 px<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; justify-content:space-between;\"><span>Abaixo disso<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#0E74B8;\">usar símbolo<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:10px;\">\n        <div style=\"break-inside:avoid;\"><div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:16px 10px; display:flex; align-items:center; justify-content:center; height:62px;\"><img src=\"feb5b5ae-3e56-4ce0-91cf-b3bb49474ee4\" alt=\"\" style=\"width:120px; height:auto; transform:scaleX(0.72);\"><\u002Fdiv><div style=\"font-size:12px; color:#8794A1; padding-top:6px; line-height:1.4;\"><strong style=\"color:#16243C;\">Não<\u002Fstrong> distorcer proporção.<\u002Fdiv><\u002Fdiv>\n        <div style=\"break-inside:avoid;\"><div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:16px 10px; display:flex; align-items:center; justify-content:center; height:62px; background:#00B0F0;\"><img src=\"feb5b5ae-3e56-4ce0-91cf-b3bb49474ee4\" alt=\"\" style=\"width:120px; height:auto;\"><\u002Fdiv><div style=\"font-size:12px; color:#8794A1; padding-top:6px; line-height:1.4;\"><strong style=\"color:#16243C;\">Não<\u002Fstrong> aplicar a versão colorida sobre ciano.<\u002Fdiv><\u002Fdiv>\n        <div style=\"break-inside:avoid;\"><div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:16px 10px; display:flex; align-items:center; justify-content:center; height:62px; background:repeating-linear-gradient(135deg,#9aa6b2 0 7px,#7c8894 7px 14px);\"><img src=\"feb5b5ae-3e56-4ce0-91cf-b3bb49474ee4\" alt=\"\" style=\"width:120px; height:auto;\"><\u002Fdiv><div style=\"font-size:12px; color:#8794A1; padding-top:6px; line-height:1.4;\"><strong style=\"color:#16243C;\">Não<\u002Fstrong> usar sobre foto agitada sem versão negativa.<\u002Fdiv><\u002Fdiv>\n        <div style=\"break-inside:avoid;\"><div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:16px 10px; display:flex; align-items:center; justify-content:center; height:62px;\"><img src=\"feb5b5ae-3e56-4ce0-91cf-b3bb49474ee4\" alt=\"\" style=\"width:120px; height:auto; filter:hue-rotate(120deg) saturate(1.6);\"><\u002Fdiv><div style=\"font-size:12px; color:#8794A1; padding-top:6px; line-height:1.4;\"><strong style=\"color:#16243C;\">Não<\u002Fstrong> recolorir fora da paleta.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 05 COR -->\n    <div style=\"break-before:page; padding-top:24px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; border-top:2px solid #16243C; padding-top:12px; margin-bottom:20px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#0E74B8;\">05<\u002Fspan>\n        <h2 style=\"margin:0; font-family:Archivo,sans-serif; font-weight:700; font-size:28px; letter-spacing:-0.02em; color:#16243C;\">Cor<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 18px; font-size:15px; line-height:1.65; max-width:40em;\">A paleta sai do próprio logo: o ciano e o azul das ondas viram cor de ação e destaque; o cinza do letreiro vira texto. O azul-noite é a base escura que o logo nunca teve e que o digital precisa para headers, rodapés e posts.<\u002Fp>\n\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px;\">\n        <div style=\"break-inside:avoid; border:1px solid #E9EDF2; border-radius:16px; overflow:hidden;\">\n          <div style=\"background:#16243C; height:88px;\"><\u002Fdiv>\n          <div style=\"padding:11px 12px;\"><div style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:14px; color:#16243C;\">Azul Noite<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#6B7785; line-height:1.6;\">#16243C<br>oklch(0.27 0.05 260)<\u002Fdiv><div style=\"font-size:12px; color:#6B7785; margin-top:5px; line-height:1.4;\">Header, rodapé, fundos de post, títulos.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"break-inside:avoid; border:1px solid #E9EDF2; border-radius:16px; overflow:hidden;\">\n          <div style=\"background:#0E74B8; height:88px;\"><\u002Fdiv>\n          <div style=\"padding:11px 12px;\"><div style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:14px; color:#16243C;\">Azul Hidro<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#6B7785; line-height:1.6;\">#0E74B8<br>oklch(0.55 0.13 245)<\u002Fdiv><div style=\"font-size:12px; color:#6B7785; margin-top:5px; line-height:1.4;\">Ação: botões, links, preço. Uma cor de ação só.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"break-inside:avoid; border:1px solid #E9EDF2; border-radius:16px; overflow:hidden;\">\n          <div style=\"background:#00B0F0; height:88px;\"><\u002Fdiv>\n          <div style=\"padding:11px 12px;\"><div style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:14px; color:#16243C;\">Ciano Onda<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#6B7785; line-height:1.6;\">#00B0F0<br>oklch(0.72 0.15 234)<\u002Fdiv><div style=\"font-size:12px; color:#6B7785; margin-top:5px; line-height:1.4;\">Destaque sobre escuro, selos, gráficos. Nunca texto sobre branco.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"break-inside:avoid; border:1px solid #E9EDF2; border-radius:16px; overflow:hidden;\">\n          <div style=\"background:#484850; height:88px;\"><\u002Fdiv>\n          <div style=\"padding:11px 12px;\"><div style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:14px; color:#16243C;\">Grafite<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#6B7785; line-height:1.6;\">#484850<br>oklch(0.42 0.01 280)<\u002Fdiv><div style=\"font-size:12px; color:#6B7785; margin-top:5px; line-height:1.4;\">Texto corrido (é a cor do letreiro do logo).<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"break-inside:avoid; border:1px solid #E9EDF2; border-radius:16px; overflow:hidden;\">\n          <div style=\"background:#EDF1F5; height:88px;\"><\u002Fdiv>\n          <div style=\"padding:11px 12px;\"><div style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:14px; color:#16243C;\">Névoa<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#6B7785; line-height:1.6;\">#EDF1F5<br>oklch(0.95 0.008 250)<\u002Fdiv><div style=\"font-size:12px; color:#6B7785; margin-top:5px; line-height:1.4;\">Fundo de seção, linhas, estados desativados.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"break-inside:avoid; border:1px solid #E9EDF2; border-radius:16px; overflow:hidden;\">\n          <div style=\"background:#FCFDFE; height:88px; border-bottom:1px solid #E2E8EE;\"><\u002Fdiv>\n          <div style=\"padding:11px 12px;\"><div style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:14px; color:#16243C;\">Papel<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#6B7785; line-height:1.6;\">#FCFDFE<br>oklch(0.99 0.003 250)<\u002Fdiv><div style=\"font-size:12px; color:#6B7785; margin-top:5px; line-height:1.4;\">Fundo padrão de tela e de card.<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:1.1fr 1fr; gap:14px;\">\n        <div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:16px; break-inside:avoid;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#8794A1; margin-bottom:10px;\">Proporção em tela<\u002Fdiv>\n          <div style=\"display:flex; height:26px; margin-bottom:8px; border-radius:999px; overflow:hidden;\">\n            <div style=\"flex:62; background:#FCFDFE; border:1px solid #E9EDF2;\"><\u002Fdiv>\n            <div style=\"flex:20; background:#EDF1F5;\"><\u002Fdiv>\n            <div style=\"flex:10; background:#16243C;\"><\u002Fdiv>\n            <div style=\"flex:6; background:#0E74B8;\"><\u002Fdiv>\n            <div style=\"flex:2; background:#00B0F0;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:0; font-size:13px; line-height:1.55;\">≈60% papel, 20% névoa, 10% azul-noite, 6% azul de ação, 2% ciano. O ciano é tempero: se ele domina a tela, a interface perde hierarquia.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:16px; break-inside:avoid;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#8794A1; margin-bottom:10px;\">Cores de estado (UI)<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:7px; font-size:13px;\">\n            <div style=\"display:flex; align-items:center; gap:9px;\"><span style=\"width: 16px; height: 16px; border-radius: 5px; background-color: #01DB60\"><\u002Fspan><span style=\"flex:1;\">Sucesso · em estoque<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#6B7785;\">#01DB60<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:9px;\"><span style=\"width:16px; height:16px; border-radius:5px; background:#E5A50A;\"><\u002Fspan><span style=\"flex:1;\">Atenção · sob consulta<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#6B7785;\">#E5A50A<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:9px;\"><span style=\"width: 16px; height: 16px; border-radius: 5px; background-color: #D62715\"><\u002Fspan><span style=\"flex:1;\">Erro · indisponível<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#6B7785;\">#D62715<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"margin:10px 0 0; font-size:12.5px; line-height:1.5; color:#6B7785;\">Usadas só para status funcional, nunca como cor decorativa de marca.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 06 CONTRASTE -->\n    <div style=\"padding-top:34px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; border-top:2px solid #16243C; padding-top:12px; margin-bottom:20px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#0E74B8;\">06<\u002Fspan>\n        <h2 style=\"margin:0; font-family:Archivo,sans-serif; font-weight:700; font-size:28px; letter-spacing:-0.02em; color:#16243C;\">Contraste e acessibilidade<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px;\">\n        <div style=\"background:#FCFDFE; border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:14px; break-inside:avoid;\"><div style=\"color:#484850; font-size:14px; margin-bottom:8px;\">Grafite sobre papel<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#0B6B36;\">8,9:1 · AAA<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#FCFDFE; border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:14px; break-inside:avoid;\"><div style=\"color:#0E74B8; font-size:14px; margin-bottom:8px;\">Azul Hidro sobre papel<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#0B6B36;\">4,9:1 · AA<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#16243C; padding:14px; break-inside:avoid;\"><div style=\"color:#00B0F0; font-size:14px; margin-bottom:8px;\">Ciano sobre noite<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#7FDCFF;\">6,2:1 · AA<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#00B0F0; padding:14px; break-inside:avoid;\"><div style=\"color:#FFFFFF; font-size:14px; margin-bottom:8px;\">Branco sobre ciano<\u002Fdiv><div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#5C2A00;\">2,5:1 · reprovado<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:14px;\">\n        <p style=\"margin:0; flex:1; font-size:13.5px; line-height:1.6;\">Regra prática: <strong style=\"color:#16243C;\">ciano só sobre azul-noite<\u002Fstrong>, texto sobre ciano sempre em azul-noite. Botão primário é branco sobre Azul Hidro; botão sobre fundo escuro é branco vazado com borda de 1,5px.<\u002Fp>\n        <p style=\"margin:0; flex:1; font-size:13.5px; line-height:1.6;\">Alvos de toque no mobile: mínimo 44×44px. Texto de interface nunca abaixo de 14px; preço e código de produto nunca abaixo de 12px em mono.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 07 TIPOGRAFIA -->\n    <div style=\"break-before:page; padding-top:24px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; border-top:2px solid #16243C; padding-top:12px; margin-bottom:20px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#0E74B8;\">07<\u002Fspan>\n        <h2 style=\"margin:0; font-family:Archivo,sans-serif; font-weight:700; font-size:28px; letter-spacing:-0.02em; color:#16243C;\">Tipografia<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px;\">\n        <div style=\"break-inside:avoid;\">\n          <div style=\"font-family:Archivo,sans-serif; font-weight:800; font-size:62px; line-height:0.85; letter-spacing:-0.04em; color:#16243C;\">Archivo<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8794A1; margin:10px 0 6px;\">400 · 600 · 700 · 800 · Google Fonts<\u002Fdiv>\n          <p style=\"margin:0; font-size:13.5px; line-height:1.55;\">Títulos, botões, preços e números. Grotesca larga, parente do letreiro do logo. Usar com tracking negativo (−0,02em) acima de 24px.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"break-inside:avoid;\">\n          <div style=\"font-family:'IBM Plex Sans',sans-serif; font-weight:400; font-size:62px; line-height:0.85; letter-spacing:-0.02em; color:#16243C;\">Plex Sans<\u002Fdiv>\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11px; color:#8794A1; margin:10px 0 6px;\">400 · 500 · 600 · Google Fonts<\u002Fdiv>\n          <p style=\"margin:0; font-size:13.5px; line-height:1.55;\">Texto corrido, descrição de produto, formulários e tabelas. Altura-x generosa, ótima leitura em telas pequenas.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:16px; margin-bottom:14px; break-inside:avoid;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#8794A1; margin-bottom:12px;\">Escala digital (web / app)<\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px;\">\n          <div style=\"display:flex; align-items:baseline; gap:16px; border-bottom:1px solid #EDF1F5; padding-bottom:8px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; color:#8794A1; width:96px; flex:none;\">H1 · 44/1.0<\u002Fspan><span style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:34px; letter-spacing:-0.03em; color:#16243C;\">Tudo em hidráulica<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:baseline; gap:16px; border-bottom:1px solid #EDF1F5; padding-bottom:8px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; color:#8794A1; width:96px; flex:none;\">H2 · 28/1.1<\u002Fspan><span style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:24px; letter-spacing:-0.02em; color:#16243C;\">Linhas de produto<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:baseline; gap:16px; border-bottom:1px solid #EDF1F5; padding-bottom:8px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; color:#8794A1; width:96px; flex:none;\">H3 · 18/1.2<\u002Fspan><span style=\"font-family:Archivo,sans-serif; font-weight:600; font-size:17px; color:#16243C;\">Tubos e conexões soldáveis<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:baseline; gap:16px; border-bottom:1px solid #EDF1F5; padding-bottom:8px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; color:#8794A1; width:96px; flex:none;\">Corpo · 16/1.6<\u002Fspan><span style=\"font-family:'IBM Plex Sans',sans-serif; font-size:15px; color:#484850;\">Consulte a linha completa e faça sua cotação.<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; align-items:baseline; gap:16px;\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; color:#8794A1; width:96px; flex:none;\">Dado · 12 mono<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#16243C;\">TUB-SOLD-25 · cx 50 · 4,7 kg<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"margin:0; font-size:13.5px; line-height:1.6; max-width:44em;\">IBM Plex Mono entra apenas em dados: SKU, bitola, quantidade, prazo, rótulos de seção em caixa alta. Nunca em frase corrida. Substitutos de sistema quando a fonte não carrega: Archivo → Helvetica Neue/Arial Bold; Plex Sans → system-ui.<\u002Fp>\n    <\u002Fdiv>\n\n    <!-- 08 COMPONENTES -->\n    <div style=\"padding-top:34px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; border-top:2px solid #16243C; padding-top:12px; margin-bottom:20px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#0E74B8;\">08<\u002Fspan>\n        <h2 style=\"margin:0; font-family:Archivo,sans-serif; font-weight:700; font-size:28px; letter-spacing:-0.02em; color:#16243C;\">Componentes de UI<\u002Fh2>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 16px; font-size:15px; line-height:1.65; max-width:40em;\">Cantos arredondados em três degraus: 16px em containers e cards, 12px em imagens e miniaturas, cápsula (999px) em botões, filtros e selos. Sombra só a de apoio (0 2px 10px rgba(22,36,60,0.05)), o resto é borda de 1px. A densidade do catálogo continua: canto macio não significa card gigante.<\u002Fp>\n\n      <div style=\"display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;\">\n        <div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:16px; break-inside:avoid;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#8794A1; margin-bottom:12px;\">Botões · altura 44px<\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:9px;\">\n            <div style=\"background: linear-gradient(180deg, #0094F6, #00A8FF); color: #fff; padding: 12px; text-align: center; border-radius: 999px; font-family: Archivo,sans-serif; font-weight: 600; font-size: 14px\">Solicitar cotação<\u002Fdiv>\n            <div style=\"border:1.5px solid #16243C; color:#16243C; padding:11px; text-align:center; border-radius:999px; font-family:Archivo,sans-serif; font-weight:600; font-size:14px;\">Adicionar à lista<\u002Fdiv>\n            <div style=\"background:#EDF1F5; color:#A4AFBB; padding:12px; text-align:center; border-radius:999px; font-family:Archivo,sans-serif; font-weight:600; font-size:14px;\">Indisponível<\u002Fdiv>\n            <div style=\"color:#0E74B8; padding:6px 0; font-family:Archivo,sans-serif; font-weight:600; font-size:14px;\">Ver ficha técnica →<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:16px; break-inside:avoid;\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#8794A1; margin-bottom:12px;\">Busca e filtro<\u002Fdiv>\n          <div style=\"border:1.5px solid #16243C; padding:11px 16px; border-radius:999px; display:flex; justify-content:space-between; font-size:14px; color:#8794A1; margin-bottom:9px;\"><span>Buscar por nome ou código<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; color:#0E74B8;\">↵<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; flex-wrap:wrap; gap:6px;\">\n            <span style=\"background:#16243C; color:#fff; font-size:12px; padding:7px 13px; border-radius:999px;\">Soldável<\u002Fspan>\n            <span style=\"background:#EDF1F5; color:#48505A; font-size:12px; padding:7px 13px; border-radius:999px;\">Esgoto<\u002Fspan>\n            <span style=\"background:#EDF1F5; color:#48505A; font-size:12px; padding:7px 13px; border-radius:999px;\">CPVC<\u002Fspan>\n            <span style=\"background:#EDF1F5; color:#48505A; font-size:12px; padding:7px 13px; border-radius:999px;\">Gás<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:8px; margin-top:12px;\">\n            <span style=\"background:#DFF5E7; color:#0B6B36; font-family:'IBM Plex Mono',monospace; font-size:11px; padding:5px 10px; border-radius:999px;\">EM ESTOQUE<\u002Fspan>\n            <span style=\"background:#FCF2D2; color:#7A5A00; font-family:'IBM Plex Mono',monospace; font-size:11px; padding:5px 10px; border-radius:999px;\">SOB CONSULTA<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; break-inside:avoid;\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#8794A1; padding:14px 16px 10px;\">Card de produto e linha de lista<\u002Fdiv>\n        <div style=\"display:grid; grid-template-columns:210px 1fr; gap:16px; padding:0 16px 16px;\">\n          <div style=\"border:1px solid #E9EDF2; border-radius:16px; overflow:hidden;\">\n            <div style=\"height:110px; background:repeating-linear-gradient(135deg,#EDF1F5 0 8px,#E1E7EE 8px 16px); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:10px; color:#8794A1;\">foto do produto 1:1<\u002Fdiv>\n            <div style=\"padding:10px 11px; display:flex; flex-direction:column; gap:5px;\">\n              <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; color:#8794A1;\">TUB-SOLD-25<\u002Fdiv>\n              <div style=\"font-family:Archivo,sans-serif; font-weight:600; font-size:13.5px; color:#16243C; line-height:1.25;\">Tubo soldável PVC 25mm · 6m<\u002Fdiv>\n              <div style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:18px; color:#0E74B8;\">R$ 18,90<\u002Fdiv>\n              <div style=\"background:#0E74B8; color:#fff; text-align:center; padding:9px; border-radius:999px; font-family:Archivo,sans-serif; font-weight:600; font-size:13px; margin-top:3px;\">Adicionar<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column;\">\n            <div style=\"display:flex; gap:12px; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.1em; color:#8794A1; border-bottom:1px solid #16243C; padding-bottom:7px;\">\n              <span style=\"flex:2;\">PRODUTO<\u002Fspan><span style=\"width:74px;\">EMBAL.<\u002Fspan><span style=\"width:74px;\">ESTOQUE<\u002Fspan><span style=\"width:74px; text-align:right;\">PREÇO<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid #EDF1F5; font-size:13px;\">\n              <span style=\"flex:2;\"><span style=\"color:#16243C; font-weight:500;\">Joelho 90° 25mm<\u002Fspan><br><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#8794A1;\">CON-J90-25<\u002Fspan><\u002Fspan>\n              <span style=\"width:74px; font-family:'IBM Plex Mono',monospace; font-size:12px;\">cx 50<\u002Fspan>\n              <span style=\"width:74px; color:#0B6B36; font-size:12px;\">Disponível<\u002Fspan>\n              <span style=\"width:74px; text-align:right; font-family:Archivo,sans-serif; font-weight:700; color:#16243C;\">R$ 2,40<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid #EDF1F5; font-size:13px;\">\n              <span style=\"flex:2;\"><span style=\"color:#16243C; font-weight:500;\">Caixa d'água 1000L<\u002Fspan><br><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#8794A1;\">RES-CX-1000<\u002Fspan><\u002Fspan>\n              <span style=\"width:74px; font-family:'IBM Plex Mono',monospace; font-size:12px;\">un<\u002Fspan>\n              <span style=\"width:74px; color:#7A5A00; font-size:12px;\">Sob consulta<\u002Fspan>\n              <span style=\"width:74px; text-align:right; font-family:Archivo,sans-serif; font-weight:700; color:#16243C;\">R$ 489,00<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:12px; align-items:center; padding:10px 0; font-size:13px;\">\n              <span style=\"flex:2;\"><span style=\"color:#16243C; font-weight:500;\">Registro esfera 3/4\"<\u002Fspan><br><span style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:#8794A1;\">REG-ESF-34<\u002Fspan><\u002Fspan>\n              <span style=\"width:74px; font-family:'IBM Plex Mono',monospace; font-size:12px;\">cx 20<\u002Fspan>\n              <span style=\"width:74px; color:#0B6B36; font-size:12px;\">Disponível<\u002Fspan>\n              <span style=\"width:74px; text-align:right; font-family:Archivo,sans-serif; font-weight:700; color:#16243C;\">R$ 24,50<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 09 FOTO E ÍCONES -->\n    <div style=\"break-before:page; padding-top:24px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; border-top:2px solid #16243C; padding-top:12px; margin-bottom:20px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#0E74B8;\">09<\u002Fspan>\n        <h2 style=\"margin:0; font-family:Archivo,sans-serif; font-weight:700; font-size:28px; letter-spacing:-0.02em; color:#16243C;\">Fotografia e ícones<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:14px;\">\n        <div style=\"break-inside:avoid;\"><div style=\"height:118px; border-radius:14px; background:repeating-linear-gradient(135deg,#EDF1F5 0 8px,#E1E7EE 8px 16px); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:10px; color:#8794A1; text-align:center;\">produto em fundo branco<br>1:1 · e-commerce<\u002Fdiv><p style=\"margin:8px 0 0; font-size:12.5px; line-height:1.5;\">Recorte limpo, sombra suave, enquadramento idêntico em toda a linha.<\u002Fp><\u002Fdiv>\n        <div style=\"break-inside:avoid;\"><div style=\"height:118px; border-radius:14px; background:repeating-linear-gradient(135deg,#E6EDF4 0 8px,#DAE3EC 8px 16px); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:10px; color:#8794A1; text-align:center;\">estoque e equipe<br>4:5 · redes<\u002Fdiv><p style=\"margin:8px 0 0; font-size:12.5px; line-height:1.5;\">Luz natural, cena real do depósito e da entrega. Nada de banco de imagens genérico.<\u002Fp><\u002Fdiv>\n        <div style=\"break-inside:avoid;\"><div style=\"height:118px; border-radius:14px; background:repeating-linear-gradient(135deg,#DCE6F0 0 8px,#CFDBE8 8px 16px); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-size:10px; color:#8794A1; text-align:center;\">detalhe técnico<br>16:9 · capa<\u002Fdiv><p style=\"margin:8px 0 0; font-size:12.5px; line-height:1.5;\">Macro de rosca, conexão, medida. Bom para capa de post e banner de site.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:14px;\">\n        <div style=\"flex:1; border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:14px; break-inside:avoid;\"><div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#8794A1; margin-bottom:6px;\">Ícones<\u002Fdiv><p style=\"margin:0; font-size:13px; line-height:1.55;\">Biblioteca única, traço de 1,5–2px, cantos retos, sem preenchimento. Sugestão: Lucide ou Phosphor (linha). Sempre em Azul Noite ou Azul Hidro; ciano só sobre fundo escuro.<\u002Fp><\u002Fdiv>\n        <div style=\"flex:1; border:1px solid #E9EDF2; border-radius:16px; overflow:hidden; padding:14px; break-inside:avoid;\"><div style=\"font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:#8794A1; margin-bottom:6px;\">Tratamento de foto<\u002Fdiv><p style=\"margin:0; font-size:13px; line-height:1.55;\">Para texto sobre foto: véu de Azul Noite a 70% ou faixa sólida. Nunca texto direto sobre imagem sem véu.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 10 GOVERNANÇA -->\n    <div style=\"padding-top:34px;\">\n      <div style=\"display:flex; align-items:baseline; gap:14px; border-top:2px solid #16243C; padding-top:12px; margin-bottom:20px;\">\n        <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; color:#0E74B8;\">10<\u002Fspan>\n        <h2 style=\"margin:0; font-family:Archivo,sans-serif; font-weight:700; font-size:28px; letter-spacing:-0.02em; color:#16243C;\">Governança<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;\">\n        <div style=\"break-inside:avoid;\"><div style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:15px; color:#16243C; margin-bottom:6px;\">Quem aprova<\u002Fdiv><p style=\"margin:0; font-size:13px; line-height:1.55;\">Peça nova fora dos padrões deste manual passa pelo responsável de marketing antes de publicar.<\u002Fp><\u002Fdiv>\n        <div style=\"break-inside:avoid;\"><div style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:15px; color:#16243C; margin-bottom:6px;\">Onde ficam os arquivos<\u002Fdiv><p style=\"margin:0; font-size:13px; line-height:1.55;\">Pasta única na nuvem: /marca com logos, fontes, templates e este PDF.<\u002Fp><\u002Fdiv>\n        <div style=\"break-inside:avoid;\"><div style=\"font-family:Archivo,sans-serif; font-weight:700; font-size:15px; color:#16243C; margin-bottom:6px;\">Versão<\u002Fdiv><p style=\"margin:0; font-family:'IBM Plex Mono',monospace; font-size:12.5px; line-height:1.7; color:#16243C;\">v1.0 · 2026<br>Revisão anual<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdoc-page>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
