<!doctype html>
<html lang="pt-BR">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protótipo — Plataforma Ademicon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PROTÓTIPO PLATAFORMA ADEMICON — tokens e base
   ============================================================ */
:root{
  --red:#C4161C; --red-700:#9E1116; --red-50:#FDECEC;
  --ink:#17171A; --ink-80:#2A2A2F; --ink-60:#3A3A41;
  --bg:#F7F7F8; --card:#FFFFFF; --line:#E5E5E8; --line-2:#EFEFF1;
  --txt:#1C1C20; --muted:#6B6B73; --muted-2:#9A9AA2;
  --green:#15803D; --green-bg:#E8F5EC; --amber:#B45309; --amber-bg:#FDF3E3;
  --danger:#C4161C; --danger-bg:#FDECEC; --blue:#1D4ED8; --blue-bg:#E8EEFD;
  --sb:#17171A; --sb-hover:#232329; --sb-txt:#B9B9C0;
  --r:10px; --r-sm:6px;
  --sh:0 1px 2px rgba(16,16,20,.06), 0 1px 3px rgba(16,16,20,.04);
  --sh-2:0 4px 16px rgba(16,16,20,.10);
  --mono:"Inter",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Inter",-apple-system,Segoe UI,Roboto,sans-serif;
  background:var(--bg); color:var(--txt); font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.num,.kpi-v,.brand{font-family:"Montserrat","Inter",sans-serif}
button{font:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
table{border-collapse:collapse;width:100%}
.num{font-variant-numeric:tabular-nums;text-align:right}
.hide{display:none!important}

/* ---------- barra do protótipo (chrome de demonstração) ---------- */
#proto{
  position:fixed;inset:0 0 auto 0;height:38px;z-index:80;background:#0B0B0D;
  display:flex;align-items:center;gap:14px;padding:0 14px;color:#D8D8DE;
  font-size:12px;border-bottom:1px solid #26262C;
}
#proto .pt{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:10px;color:#6E6E78}
#proto .sep{width:1px;height:18px;background:#26262C}
#proto .pbtn{
  background:transparent;border:1px solid #2C2C33;color:#B9B9C0;border-radius:999px;
  padding:4px 11px;font-size:11.5px;font-weight:500;transition:.15s;
}
#proto .pbtn:hover{background:#1C1C21;color:#fff}
#proto .pbtn.on{background:var(--red);border-color:var(--red);color:#fff;font-weight:600}
#proto .spacer{flex:1}
#proto .ref{color:#56565F;font-size:11px}

/* ---------- shell ---------- */
#app{padding-top:38px;min-height:100vh}
.shell{display:grid;grid-template-columns:236px 1fr;min-height:calc(100vh - 38px)}
.sb{background:var(--sb);color:var(--sb-txt);display:flex;flex-direction:column;position:sticky;top:38px;height:calc(100vh - 38px)}
.sb-brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.sb-brand .mk{width:26px;height:26px;border-radius:6px;background:var(--red);display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px;font-family:"Montserrat"}
.sb-brand b{color:#fff;font-size:14.5px;letter-spacing:-.2px;font-family:"Montserrat";font-weight:700}
.sb-brand span{display:block;font-size:10px;color:#6E6E78;letter-spacing:.1em;text-transform:uppercase;margin-top:1px}
.sb-ctx{margin:0 12px 12px;padding:9px 11px;background:#1F1F25;border-radius:var(--r-sm);border:1px solid #2A2A31}
.sb-ctx .l{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:#6E6E78}
.sb-ctx .v{font-size:12.5px;color:#EDEDF0;font-weight:600;margin-top:2px}
.sb nav{flex:1;overflow:auto;padding:4px 8px 16px}
.sb .grp{font-size:9.5px;text-transform:uppercase;letter-spacing:.12em;color:#55555E;padding:14px 12px 6px;font-weight:700}
.sb a.it{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r-sm);font-size:13px;color:var(--sb-txt);margin-bottom:1px}
.sb a.it:hover{background:var(--sb-hover);color:#fff}
.sb a.it.on{background:var(--red);color:#fff;font-weight:600}
.sb a.it .ic{width:16px;height:16px;flex:none;opacity:.9}
.sb a.it.on .ic{opacity:1}
.sb-foot{padding:12px;border-top:1px solid #23232A;display:flex;align-items:center;gap:9px}
.av{width:30px;height:30px;border-radius:50%;background:#2E2E36;color:#fff;display:grid;place-items:center;font-size:11.5px;font-weight:700;flex:none}
.sb-foot .nm{font-size:12.5px;color:#EDEDF0;font-weight:600;line-height:1.2}
.sb-foot .rl{font-size:10.5px;color:#7A7A84}

/* ---------- topbar ---------- */
.main{min-width:0;display:flex;flex-direction:column}
.tb{
  height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:12px;padding:0 20px;position:sticky;top:38px;z-index:40;
}
.tb h1{font-size:15.5px;margin:0;font-weight:700;letter-spacing:-.2px}
.tb .sub{font-size:12px;color:var(--muted);margin-top:1px}
.tb .spacer{flex:1}
.sel{
  cursor:pointer;user-select:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:6px 12px;font-size:12.5px;font-weight:600;color:var(--txt);position:relative;
}
.sel:hover{border-color:#CFCFD4}
.sel .dot{width:7px;height:7px;border-radius:50%;background:var(--red)}
.sel .cr{color:var(--muted-2);font-size:10px}
.menu{
  position:absolute;top:calc(100% + 6px);right:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-2);min-width:238px;padding:6px;z-index:60;text-align:left;
}
.menu .mh{font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-2);padding:7px 9px 4px;font-weight:700}
.menu button{display:flex;width:100%;align-items:center;gap:9px;background:none;border:0;padding:8px 9px;border-radius:var(--r-sm);font-size:13px;text-align:left;color:var(--txt)}
.menu button:hover{background:var(--bg)}
.menu button.on{background:var(--red-50);color:var(--red-700);font-weight:600}
.menu .mi-s{font-size:11px;color:var(--muted);font-weight:400}
.menu hr{border:0;border-top:1px solid var(--line-2);margin:5px 2px}
.btn{border:1px solid var(--line);background:#fff;border-radius:var(--r-sm);padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--txt);display:inline-flex;align-items:center;gap:7px}
.btn:hover{background:#FAFAFB;border-color:#CFCFD4}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-700);border-color:var(--red-700)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn.gh{border-color:transparent;background:transparent;color:var(--muted)}
.btn.gh:hover{background:var(--bg);color:var(--txt)}

/* ---------- conteúdo ---------- */
.wrap{padding:20px 20px 56px;max-width:1420px;width:100%}
.pg-h{display:flex;align-items:flex-end;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.pg-h h2{margin:0;font-size:19px;letter-spacing:-.3px}
.pg-h p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.pg-h .spacer{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.card.p{padding:16px}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line-2)}
.card-h h3{margin:0;font-size:13.5px;font-weight:700}
.card-h .s{font-size:11.5px;color:var(--muted)}
.card-h .spacer{flex:1}
.card-b{padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.g23{grid-template-columns:minmax(0,2fr) minmax(0,3fr)}
.g32{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
.mb{margin-bottom:14px}
.mt{margin-top:14px}
@media(max-width:1180px){.g4,.g5,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3,.g23,.g32{grid-template-columns:1fr}}

/* ---------- KPI ---------- */
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;box-shadow:var(--sh)}
.kpi .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.kpi-v{font-size:25px;font-weight:700;letter-spacing:-.8px;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;color:var(--muted);margin-top:4px}
.kpi.acc{border-left:3px solid var(--red)}
.kpi.ok .kpi-v{color:var(--green)}
.kpi.bad .kpi-v{color:var(--danger)}
.kpi.wn .kpi-v{color:var(--amber)}
.kpi.big .kpi-v{font-size:32px}
.delta{font-size:11.5px;font-weight:700;display:inline-flex;gap:3px;align-items:center}
.delta.up{color:var(--green)} .delta.dn{color:var(--danger)}

/* ---------- badges / pills ---------- */
.bd{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
.bd.ok{background:var(--green-bg);color:var(--green)}
.bd.wn{background:var(--amber-bg);color:var(--amber)}
.bd.er{background:var(--danger-bg);color:var(--danger)}
.bd.nt{background:#EFEFF1;color:#5A5A62}
.bd.bl{background:var(--blue-bg);color:var(--blue)}
.bd.sq{border-radius:var(--r-sm)}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:4px;background:#EFEFF1;color:#5A5A62;text-transform:uppercase}
.tag.red{background:var(--red-50);color:var(--red-700)}
.tag.ink{background:#E8E8EB;color:var(--ink)}

/* ---------- tabelas densas ---------- */
.tbl{font-size:12.5px}
.tbl th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:700;padding:9px 12px;border-bottom:1px solid var(--line);background:#FBFBFC;white-space:nowrap;
}
.tbl th.num{text-align:right}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr:hover{background:#FBFBFC}
.tbl tbody tr.sel-row{background:var(--red-50)}
.tbl tbody tr.div-row{background:var(--danger-bg)}
.tbl tbody tr.div-row:hover{background:#FBDFDF}
.tbl tfoot td{padding:10px 12px;font-weight:700;border-top:1px solid var(--line);background:#FBFBFC;font-size:12.5px}
.tbl .nmc{font-weight:600}
.tbl .sm{font-size:11px;color:var(--muted)}
.tbl.zebra tbody tr:nth-child(even){background:#FCFCFD}
.tbl td.num,.tbl tfoot td.num{font-variant-numeric:tabular-nums;text-align:right}
.scroll{overflow:auto}
.exp-row td{background:#FAFAFB;padding:0}
.exp-in{padding:12px 14px 14px 36px}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:9px 13px;font-size:12.5px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--txt)}
.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
.segs{display:inline-flex;background:#EFEFF1;border-radius:999px;padding:3px}
.segs button{background:none;border:0;padding:5px 13px;border-radius:999px;font-size:12px;font-weight:600;color:var(--muted)}
.segs button.on{background:#fff;color:var(--txt);box-shadow:var(--sh)}

/* ---------- barras / progresso ---------- */
.pbar{height:8px;border-radius:999px;background:#EDEDF0;overflow:hidden;position:relative}
.pbar>i{display:block;height:100%;border-radius:999px;background:var(--red)}
.pbar.ok>i{background:var(--green)} .pbar.wn>i{background:var(--amber)} .pbar.bad>i{background:var(--danger)}
.pbar.tall{height:11px}
.meta-bar{position:relative;height:30px;border-radius:6px;background:#EDEDF0;overflow:visible}
.meta-bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:6px 0 0 6px;background:linear-gradient(90deg,var(--red),#E0393F)}
.meta-bar .mk{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.meta-bar .mk b{position:absolute;bottom:calc(100% + 3px);left:50%;transform:translateX(-50%);font-size:9.5px;white-space:nowrap;color:var(--ink);background:#fff;padding:0 3px;font-weight:700;font-family:"Montserrat"}
.meta-bar .mk s{position:absolute;top:calc(100% + 3px);left:50%;transform:translateX(-50%);font-size:9.5px;white-space:nowrap;color:var(--muted);text-decoration:none;font-variant-numeric:tabular-nums}

/* ---------- mês cards ---------- */
.mon{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:8px}
@media(max-width:1180px){.mon{grid-template-columns:repeat(6,minmax(0,1fr))}}
.mc{border:1px solid var(--line);border-radius:8px;padding:9px 8px;background:#fff;text-align:center}
.mc .m{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.mc .v{font-size:14px;font-weight:700;font-family:"Montserrat";margin-top:3px;font-variant-numeric:tabular-nums}
.mc .p{font-size:10.5px;margin-top:2px;font-weight:600}
.mc.ok{background:var(--green-bg);border-color:#BFE3CB} .mc.ok .p{color:var(--green)}
.mc.bad{background:#FDF1F1;border-color:#F3CDCE} .mc.bad .p{color:var(--danger)}
.mc.cur{background:var(--amber-bg);border-color:#F0DCB4} .mc.cur .p{color:var(--amber)}
.mc.cur{outline:2px solid var(--amber);outline-offset:-2px}

/* ---------- listas / ranking ---------- */
.rk{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line-2)}
.rk:last-child{border-bottom:0}
.rk .pos{width:26px;height:26px;border-radius:50%;background:#EFEFF1;color:#5A5A62;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none;font-family:"Montserrat"}
.rk.m1 .pos{background:#F5D77E;color:#6B4E00} .rk.m2 .pos{background:#DEDEE3;color:#4A4A52} .rk.m3 .pos{background:#E8C9A8;color:#6B4523}
.rk .nm{font-weight:600;flex:1;min-width:0}
.rk .nm s{display:block;text-decoration:none;font-size:11px;color:var(--muted);font-weight:400}
.rk .vl{font-variant-numeric:tabular-nums;font-weight:700;font-family:"Montserrat"}
.rk.me{background:var(--red-50)}
.rk.me .nm{color:var(--red-700)}
.list-empty{padding:40px 20px;text-align:center;color:var(--muted)}
.list-empty .ti{font-weight:700;color:var(--txt);margin-bottom:4px;font-size:14px}

/* ---------- organograma ---------- */
.org{padding:8px 4px 20px;overflow:auto}
.org-lvl{display:flex;justify-content:center;gap:16px;flex-wrap:nowrap}
.pcard{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:11px 13px;min-width:198px;box-shadow:var(--sh);position:relative}
.pcard.boss{border-color:var(--ink);border-width:1.5px}
.pcard.lead{border-left:3px solid var(--red)}
.pcard .ph{display:flex;align-items:center;gap:9px}
.pcard .av{background:#E8E8EB;color:#4A4A52}
.pcard .n{font-weight:700;font-size:13px;line-height:1.2}
.pcard .r{font-size:10.5px;color:var(--muted)}
.pcard .mt-i{margin-top:8px;padding-top:8px;border-top:1px solid var(--line-2);font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.pcard .mv{font-weight:700;color:var(--txt);font-variant-numeric:tabular-nums}
.pcard .mvbtn{position:absolute;top:8px;right:8px;opacity:0;transition:.15s}
.pcard:hover .mvbtn{opacity:1}
.conn{height:22px;display:flex;justify-content:center}
.conn i{width:2px;background:var(--line);display:block;height:100%}
.branches{display:flex;justify-content:center;gap:16px;align-items:flex-start}
.branch{display:flex;flex-direction:column;align-items:center}
.branch .kids{display:flex;flex-direction:column;gap:8px;position:relative;padding-left:18px}
.branch .kids:before{content:"";position:absolute;left:0;top:-10px;bottom:14px;width:2px;background:var(--line)}
.branch .kids .pcard:before{content:"";position:absolute;left:-18px;top:22px;width:18px;height:2px;background:var(--line)}
.aside-blk{border:1px dashed var(--line);border-radius:var(--r);padding:12px;background:#FBFBFC}
.aside-blk .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:9px}

/* ---------- formulários ---------- */
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-60);margin-bottom:5px}
.inp{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font:inherit;font-size:13px;background:#fff;color:var(--txt)}
.inp:focus{outline:2px solid rgba(196,22,28,.18);border-color:var(--red)}
.inp[readonly]{background:#FAFAFB;color:var(--muted)}
.hintl{font-size:11px;color:var(--muted);margin-top:4px}
.steps{display:flex;align-items:center;gap:0;margin-bottom:18px}
.steps .st{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
.steps .st .n{width:22px;height:22px;border-radius:50%;background:#EFEFF1;color:#6B6B73;display:grid;place-items:center;font-size:11px;font-weight:800}
.steps .st.on{color:var(--txt)} .steps .st.on .n{background:var(--red);color:#fff}
.steps .st.dn .n{background:var(--green);color:#fff}
.steps .ln{width:34px;height:2px;background:var(--line);margin:0 10px}
.note{border-left:3px solid var(--amber);background:var(--amber-bg);padding:10px 13px;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:12.5px;color:#6B4A0C}
.note.info{border-color:var(--blue);background:var(--blue-bg);color:#17347F}
.note.danger{border-color:var(--danger);background:var(--danger-bg);color:#8C1216}
.note b{font-weight:700}
.pend{font-size:11px;color:var(--amber);font-weight:700;display:inline-flex;align-items:center;gap:4px}

/* ---------- gráficos SVG ---------- */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-family:"Inter",sans-serif}
.lgd{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:10px}
.lgd i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}
.lgd b{color:var(--txt);font-variant-numeric:tabular-nums}

/* ---------- login / seleção ---------- */
.auth{min-height:calc(100vh - 38px);display:grid;place-items:center;background:
  radial-gradient(1000px 500px at 80% -10%,rgba(196,22,28,.35),transparent 60%),
  radial-gradient(700px 400px at 10% 110%,rgba(196,22,28,.18),transparent 60%),#0E0E11;padding:30px}
.auth-card{width:384px;background:#fff;border-radius:14px;padding:30px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.auth-card .lg{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.auth-card h2{margin:0 0 4px;font-size:19px}
.auth-card p.s{margin:0 0 20px;color:var(--muted);font-size:12.5px}
.auth-wide{width:720px;background:transparent;box-shadow:none;padding:0;color:#fff}
.unit-card{background:#fff;border-radius:12px;padding:20px;text-align:left;border:2px solid transparent;width:100%;box-shadow:var(--sh-2)}
.unit-card:hover{border-color:var(--red)}
.unit-card .u{font-family:"Montserrat";font-size:17px;font-weight:700}
.unit-card .g{font-size:11.5px;color:var(--muted)}
.unit-card .rl{margin-top:12px;padding-top:12px;border-top:1px solid var(--line-2);font-size:12px;color:var(--muted)}

/* ---------- modo apresentação (TV) ---------- */
#tv{position:fixed;inset:0;z-index:100;background:#08080A;color:#fff;display:none}
#tv.on{display:block}
.tv-stage{position:absolute;inset:0;display:flex;flex-direction:column;padding:56px 72px 76px}
.tv-slide{display:none;flex:1;min-height:0;flex-direction:column}
.tv-slide.on{display:flex}
#tv .eyebrow{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:#8A8A95;font-weight:700}

#tv .tvcard .v{font-family:"Montserrat";font-size:38px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums}

.tv-nav{position:absolute;left:0;right:0;bottom:0;height:68px;display:flex;align-items:center;gap:14px;padding:0 72px;color:#6E6E78;font-size:13px}
.tv-nav .dots{display:flex;gap:7px;flex:1}
.tv-nav .dots i{width:7px;height:7px;border-radius:50%;background:#34343D}
.tv-nav .dots i.on{background:var(--red);width:22px;border-radius:999px}
.tv-nav button{background:#17171C;border:1px solid #2A2A33;color:#D8D8DE;width:38px;height:38px;border-radius:50%;font-size:16px;display:grid;place-items:center}
.tv-nav button:hover{background:#22222A}
.tv-mark{position:absolute;top:34px;right:72px;display:flex;align-items:center;gap:10px;color:#fff}
.tv-mark .mk{width:30px;height:30px;border-radius:7px;background:var(--red);display:grid;place-items:center;font-weight:800;font-family:"Montserrat"}

/* ---------- comparação lado a lado ---------- */
.cmp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media(max-width:1180px){.cmp{grid-template-columns:1fr}}
.cmp-col{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden;box-shadow:var(--sh)}
.cmp-col>.hd{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.cmp-col>.hd .who{font-weight:700;font-size:13px}
.cmp-col>.hd .pr{font-size:11px;color:var(--muted)}
.cmp-col.gestao>.hd{background:#17171A;color:#fff;border-bottom-color:#17171A}
.cmp-col.gestao>.hd .pr{color:#A8A8B2}
.cmp-col.assistente>.hd{background:var(--blue-bg)}
.cmp-col.consultor>.hd{background:var(--green-bg)}
.cmp-bd{padding:14px;font-size:12px}
.blocked{border:1px dashed #D8D8DE;border-radius:var(--r-sm);padding:12px;background:#FAFAFB;color:var(--muted-2);text-align:center;font-size:11.5px}
.blocked b{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}

/* ---------- mobile frames ---------- */
.phones{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.phone{width:390px;flex:none}
.phone .fr{width:390px;height:844px;border:10px solid #17171A;border-radius:38px;overflow:hidden;background:#fff;box-shadow:var(--sh-2);position:relative;display:flex;flex-direction:column}
.phone .cap{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
.ph-st{height:26px;background:#17171A;color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:none}
.ph-tb{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:none}
.ph-bd{flex:1;overflow:auto;padding:14px;background:var(--bg)}
.ph-nav{height:58px;border-top:1px solid var(--line);display:flex;background:#fff;flex:none}
.ph-nav div{flex:1;display:grid;place-items:center;font-size:9.5px;color:var(--muted-2);gap:3px;text-align:center}
.ph-nav div.on{color:var(--red);font-weight:700}

/* ---------- mapa de cotas (C8) ---------- */
.qmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:5px}
.q{border:1px solid var(--line);border-radius:5px;padding:6px 2px;text-align:center;font-size:10.5px;font-weight:700;
   font-variant-numeric:tabular-nums;background:#fff;color:#5A5A62;position:relative;font-family:"Montserrat"}
.q.liv{background:var(--green-bg);border-color:#BFE3CB;color:var(--green);cursor:pointer}
.q.liv:hover{background:#15803D;border-color:#15803D;color:#fff}
.q.res{background:var(--amber-bg);border-color:#F0DCB4;color:var(--amber)}
.q.ven{background:#F1F1F3;border-color:#E2E2E6;color:#A8A8B0;text-decoration:line-through}
.q.mia{background:var(--red);border-color:var(--red);color:#fff}
.q.sel{outline:2px solid var(--ink);outline-offset:1px;background:#15803D;border-color:#15803D;color:#fff}
.q-lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);align-items:center}
.q-lg i{width:12px;height:12px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-2px;border:1px solid var(--line)}
.grow{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:#fff;text-align:left;width:100%;box-shadow:var(--sh)}
.grow:hover{border-color:var(--red)}
.grow.on{border-color:var(--red);border-width:1.5px;background:var(--red-50)}

/* ---------- mapa de telas ---------- */
.map-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}

.sct:after{content:"";flex:1;height:1px;background:var(--line)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
.kv:last-child{border-bottom:0}

.kv .v{font-weight:600;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.hr{border:0;border-top:1px solid var(--line-2);margin:14px 0}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.muted{color:var(--muted)}
.sm{font-size:11.5px}
.b{font-weight:700}

/* ---- gráfico de barras (com linha de meta opcional) ---- */
function chBars(items,o={}){
  const W=o.w||720, H=o.h||210, pl=o.pl||54, pr=10, pt=14, pb=24;
  const pw=W-pl-pr, ph=H-pt-pb;
  const vals=items.map(d=>d.v), mx=Math.max(...vals, o.meta||0)*1.14 || 1;
  const bw=Math.min(o.bw||38, pw/items.length*0.66);
  const y=v=>pt+ph*(1-v/mx);
  let g="";
  for(let i=0;i<=4;i++){const yy=pt+ph*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#EDEDF0"/>
  <text x="${pl-8}" y="${yy+3.5}" text-anchor="end" font-size="9.5" fill="#9A9AA2">${o.fmtAxis?o.fmtAxis(mx*(1-i/4)):miS(mx*(1-i/4))}</text>`;}
  let b="";
  items.forEach((d,i)=>{
    const cx=pl+pw*(i+.5)/items.length, h=Math.max(d.v>0?2:0, ph*d.v/mx);
    const c=d.c|| (o.colorBy? o.colorBy(d) : "var(--red)");
    b+=`<rect x="${cx-bw/2}" y="${y(d.v)}" width="${bw}" height="${h}" rx="3" fill="${c}" ${d.op?`opacity="${d.op}"`:""}/>`;
    if(o.showVal&&d.v>0) b+=`<text x="${cx}" y="${y(d.v)-5}" text-anchor="middle" font-size="9.5" font-weight="700" fill="#3A3A41">${o.fmtVal?o.fmtVal(d.v):miS(d.v)}</text>`;
    b+=`<text x="${cx}" y="${H-7}" text-anchor="middle" font-size="10" fill="${d.hl?"#C4161C":"#6B6B73"}" font-weight="${d.hl?700:500}">${d.l}</text>`;
  });
  let m="";
  if(o.meta) m=`<line x1="${pl}" x2="${W-pr}" y1="${y(o.meta)}" y2="${y(o.meta)}" stroke="#17171A" stroke-width="1.4" stroke-dasharray="5 4"/>
   <text x="${W-pr}" y="${y(o.meta)-6}" text-anchor="end" font-size="9.5" font-weight="700" fill="#17171A">${o.metaLabel||("meta "+miS(o.meta))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" height="${H}">${g}${b}${m}</svg>`;
}
/* ---- barras empilhadas ---- */
function chStack(items,series,o={}){
  const W=o.w||720, H=o.h||230, pl=o.pl||54, pr=10, pt=14, pb=24;
  const pw=W-pl-pr, ph=H-pt-pb;
  const tot=items.map(d=>series.reduce((a,s)=>a+(d[s.k]||0),0));
  const mx=Math.max(...tot,o.meta||0)*1.14||1;
  const bw=Math.min(o.bw||34, pw/items.length*0.68);
  let g="";
  for(let i=0;i<=4;i++){const yy=pt+ph*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#EDEDF0"/>
   <text x="${pl-8}" y="${yy+3.5}" text-anchor="end" font-size="9.5" fill="#9A9AA2">${o.fmtAxis?o.fmtAxis(mx*(1-i/4)):miS(mx*(1-i/4))}</text>`;}
  let b="";
  items.forEach((d,i)=>{
    const cx=pl+pw*(i+.5)/items.length; let acc=0;
    series.forEach(s=>{
      const v=d[s.k]||0; if(!v) return;
      const h=ph*v/mx, yy=pt+ph-(acc+v)/mx*ph;
      b+=`<rect x="${cx-bw/2}" y="${yy}" width="${bw}" height="${h}" fill="${s.c}"/>`; acc+=v;
    });
    b+=`<text x="${cx}" y="${H-7}" text-anchor="middle" font-size="10" fill="#6B6B73">${d[o.lk||"l"]}</text>`;
    if(o.showTot) b+=`<text x="${cx}" y="${pt+ph-tot[i]/mx*ph-5}" text-anchor="middle" font-size="9" font-weight="700" fill="#3A3A41">${miS(tot[i])}</text>`;
  });
  let m = o.meta?`<line x1="${pl}" x2="${W-pr}" y1="${pt+ph*(1-o.meta/mx)}" y2="${pt+ph*(1-o.meta/mx)}" stroke="#17171A" stroke-width="1.4" stroke-dasharray="5 4"/>
   <text x="${W-pr}" y="${pt+ph*(1-o.meta/mx)-6}" text-anchor="end" font-size="9.5" font-weight="700" fill="#17171A">${o.metaLabel||"meta diária"}</text>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" height="${H}">${g}${b}${m}</svg>`;
}
/* ---- linha / área ---- */
function chLine(labels,series,o={}){
  const W=o.w||720, H=o.h||210, pl=o.pl||54, pr=12, pt=14, pb=24;
  const pw=W-pl-pr, ph=H-pt-pb;
  const all=series.flatMap(s=>s.v.filter(v=>v!=null));
  const mx=Math.max(...all,o.meta||0)*1.15||1, mn=o.min||0;
  const X=i=>pl+pw*i/Math.max(1,labels.length-1), Y=v=>pt+ph*(1-(v-mn)/(mx-mn));
  let g="";
  for(let i=0;i<=4;i++){const yy=pt+ph*i/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#EDEDF0"/>
   <text x="${pl-8}" y="${yy+3.5}" text-anchor="end" font-size="9.5" fill="#9A9AA2">${o.fmtAxis?o.fmtAxis(mn+(mx-mn)*(1-i/4)):miS(mn+(mx-mn)*(1-i/4))}</text>`;}
  let p="";
  series.forEach((s,si)=>{
    const pts=s.v.map((v,i)=>v==null?null:[X(i),Y(v)]).filter(Boolean);
    const d=pts.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
    if(s.area) p+=`<path d="${d} L${pts[pts.length-1][0]} ${pt+ph} L${pts[0][0]} ${pt+ph} Z" fill="${s.c}" opacity=".10"/>`;
    p+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-dasharray="${s.dash||""}" stroke-linejoin="round"/>`;
    pts.forEach(q=>{p+=`<circle cx="${q[0]}" cy="${q[1]}" r="3.1" fill="#fff" stroke="${s.c}" stroke-width="2"/>`;});
    if(s.lbl) s.v.forEach((v,i)=>{ if(v!=null) p+=`<text x="${X(i)}" y="${Y(v)-9}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${s.c}">${o.fmtVal?o.fmtVal(v):v}</text>`;});
  });
  let lb=labels.map((l,i)=>`<text x="${X(i)}" y="${H-7}" text-anchor="middle" font-size="10" fill="#6B6B73">${l}</text>`).join("");
  let m=o.meta?`<line x1="${pl}" x2="${W-pr}" y1="${Y(o.meta)}" y2="${Y(o.meta)}" stroke="#C4161C" stroke-width="1.4" stroke-dasharray="5 4"/>
   <text x="${W-pr}" y="${Y(o.meta)-6}" text-anchor="end" font-size="9.5" font-weight="700" fill="#C4161C">${o.metaLabel||""}</text>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" height="${H}">${g}${m}${p}${lb}</svg>`;
}
/* ---- rosca ---- */
function chDonut(parts,o={}){
  const S=o.s||168, r=S/2-6, ir=o.ir||r*0.58, cx=S/2, cy=S/2;
  const tot=parts.reduce((a,p)=>a+p.v,0)||1; let a0=-Math.PI/2, g="";
  parts.forEach(p=>{
    const a1=a0+2*Math.PI*p.v/tot, la=(a1-a0)>Math.PI?1:0;
    const x0=cx+r*Math.cos(a0), y0=cy+r*Math.sin(a0), x1=cx+r*Math.cos(a1), y1=cy+r*Math.sin(a1);
    const X0=cx+ir*Math.cos(a1), Y0=cy+ir*Math.sin(a1), X1=cx+ir*Math.cos(a0), Y1=cy+ir*Math.sin(a0);
    g+=`<path d="M${x0} ${y0} A${r} ${r} 0 ${la} 1 ${x1} ${y1} L${X0} ${Y0} A${ir} ${ir} 0 ${la} 0 ${X1} ${Y1} Z" fill="${p.c}"/>`;
    a0=a1;
  });

const kpi=(k,v,d="",c="")=>`<div class="kpi ${c}"><div class="k">${k}</div><div class="kpi-v">${v}</div>${d?`<div class="d">${d}</div>`:""}</div>`;

const cardFlush=(t,body,o={})=>`<div class="card ${o.cls||""}">${t?`<div class="card-h"><h3>${t}</h3>${o.s?`<span class="s">${o.s}</span>`:""}<span class="spacer"></span>${o.act||""}</div>`:""}${body}</div>`;
const stBadge=s=>({pago:'<span class="bd ok">Pago</span>',atraso:'<span class="bd er">Em atraso</span>',nao:'<span class="bd nt">Não pago</span>',
  ok:'<span class="bd ok">Recebida</span>',pend:'<span class="bd wn">Pendente</span>',div:'<span class="bd er">Divergente</span>'}[s]||"");
const pendNote = t => `<div class="pend">${ic("alert",13)} regra a confirmar${t?` — ${t}`:""}</div>`;
const avatar=(ini,cls="")=>`<span class="av ${cls}">${ini}</span>`;

function addMonths(k){ /* parcela k a partir de 12/09/2026 */
  const m0=8+(k-1); const y=2026+Math.floor(m0/12); const m=m0%12;
  return `12/${String(m+1).padStart(2,"0")}/${y}`;
}
function parcelasCota(c,qtd=16){
  const out=[];
  for(let n=1;n<=qtd;n++){
    let com=0, det=[];
    if(n>=c.pIni&&n<=c.pFim){com+=c.parcPrinc;det.push("principal");}
    if(n>=c.rIni&&n<=c.rFim){com+=c.parcRec;det.push("recorrente");}
    if(c.seg&&n===14){com+=c.comSeg;det.push("seguro");}
    out.push({n, venc:addMonths(n), com, det:det.join(" + "),
      pago:n===1?"12/09/2026":"", st:n===1?"pago":"nao",
      vParc:+(c.cred/c.prazo).toFixed(2)});
  }
  return out;
}

/* ---- C8 · Mapa de cotas — o que está disponível para vender ---- */
function cotasDoGrupo(g){
  let seed=g.seed, out=[];
  const rnd=()=>{ seed=(seed*1103515245+12345)%2147483648; return seed/2147483648; };
  for(let i=1;i<=g.total;i++){
    const r=rnd();
    out.push({num:String(i).padStart(3,"0"), st: r<g.pVend?"ven":(r<g.pVend+g.pRes?"res":"liv")});
  }
  g.vendidas.forEach(n=>{const c=out.find(x=>x.num===n); if(c)c.st="ven";});
  g.minhas.forEach(n=>{const c=out.find(x=>x.num===n); if(c)c.st="mia";});
  return out;
}

    <div class="eyebrow">Ranking de setembro</div><h2>Os consultores</h2>
    <div style="display:grid;grid-template-columns:3fr 2fr;gap:40px;min-height:0">
      <div>${D.ranking.slice(0,6).map((r,i)=>`<div class="rk ${i<3?"m"+(i+1):""}">
        <span class="pos" style="width:34px;height:34px;font-size:15px">${i+1}</span>
        <span class="nm" style="font-size:19px">${r.n}<s style="font-size:13px">${r.cotas} cotas · equipe ${r.eq}</s></span>
        <span class="vl">${mi(r.v)}</span></div>`).join("")}</div>
      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="tvcard"><div class="k">Total do mês</div><div class="v">${mi(8300000)}</div><div class="d">${pctN(8300000/D.metaMes*100)} da meta mensal</div></div>
        <div class="tvcard"><div class="k">Equipes</div>
          ${D.equipesSet.map(e=>`<div style="display:flex;justify-content:space-between;margin-top:12px;font-size:18px">
            <span>${e.n.split(" ")[0]}</span><b style="font-family:Montserrat">${mi2(e.v)}</b></div>`).join("")}</div>
        <div class="tvcard"><div class="k">Cotas · clientes</div><div class="v">32 · 23</div></div>
      </div>
    </div>
  </div>`,
  /* 5 — janta do milhão */
  ()=>`<div class="tv-slide" style="justify-content:center;text-align:center;align-items:center">
    <div class="eyebrow">Campanha do mês</div>
    <h2 style="font-size:58px">🏆 Janta do Milhão</h2>
    <div style="display:flex;gap:28px;margin-top:14px">
      ${D.jantaMilhao.map((n,i)=>{const r=D.ranking.find(x=>x.n===n);
        return `<div class="tvcard" style="width:320px;${i===0?"border-color:#FF4B52":""}">
        <div style="font-size:42px">${["👑","🥈","🥉"][i]}</div>
        <div style="font-family:Montserrat;font-size:26px;font-weight:700;margin-top:10px">${n}</div>
        <div class="v" style="font-size:30px;color:#FF4B52">${mi(r.v)}</div>
        <div class="d">${r.cotas} cotas · equipe ${r.eq}</div></div>`}).join("")}
    </div>
    <div style="margin-top:34px;font-size:20px;color:#8A8A95">Classificação acima de R$ 1 milhão no mês · faltam 15 dias para o fechamento</div>
  </div>`,
  /* 6 — equipe */
  ()=>`<div class="tv-slide">
    <div class="eyebrow">Expansão</div><h2>De 24 para 50 consultores</h2>
    <div style="display:flex;gap:50px;align-items:center">
      <div><div class="big">24</div><div style="color:#8A8A95;font-size:20px;margin-top:8px">hoje</div></div>
      <div style="font-size:46px;color:#34343D">→</div>
      <div><div class="big red">50</div><div style="color:#8A8A95;font-size:20px;margin-top:8px">meta de dezembro</div></div>
      <div class="tvcard" style="margin-left:auto;width:420px">
        <div class="k">O que falta</div><div class="v">26 contratações</div>
        <div class="pbar" style="margin:16px 0 10px"><i style="width:48%;background:#FF4B52"></i></div>
        <div class="d">ritmo atual +0,7/mês · necessário +8,7/mês</div></div>
    </div>
    <div style="margin-top:44px;font-size:22px;line-height:1.6;color:#C8C8D0;max-width:980px">
      Com 24 consultores, cada um precisa vender <b style="color:#FF4B52">${mi((D.metas2026[0].v-D.acumulado)/MESES_REST/24)}</b> por mês
      até dezembro para fechar o piso. Com 50, a conta cai para <b style="color:#22C55E">${mi((D.metas2026[0].v-D.acumulado)/MESES_REST/50)}</b>.</div>
  </div>`
];
function renderTV(){
  const n=TV_SLIDES.length, i=ST.tvSlide||0;
  document.getElementById("tv").innerHTML = `
    <div class="tv-mark">${LOGO(30)}<span style="color:#56565F;font-size:13px;margin-left:8px">Concórdia · ${HOJE}</span></div>
    <div class="tv-stage">${TV_SLIDES.map((s,k)=>s().replace('class="tv-slide"', `class="tv-slide ${k===i?"on":""}"`)).join("")}
      <div class="tv-nav">
        <div class="dots">${Array.from({length:n},(_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
        <span>${i+1} / ${n} · setas ← → para navegar · Esc para sair</span>
        <button data-tv="prev">←</button><button data-tv="next">→</button>
        <button data-tv="close" style="width:auto;border-radius:999px;padding:0 16px">Sair</button>
      </div></div>`;
  document.getElementById("tv").classList.toggle("on", !!ST.tv);
}

/* ============================================================
   10. NAVEGAÇÃO, ESTADO E ROTEADOR
   ============================================================ */
const NAV = {
  gestao:[
    {g:"Painel comercial", it:[["G1","Metas gerais","chart"],["G2","Categorias","layers"],["G3","Ranking","trophy"],["G4","Performance","users"],["G5","Evolução diária","chart"],["G6","Expansão da equipe","users"]]},
    {g:"Comissões", it:[["G8","Visão geral","wallet"],["G9","Fluxo futuro","flow"],["G10","Conciliação","check"],["G11","Gestão e liderança","trophy"]]},
    {g:"Operação", it:[["G12","Vendas & Cotas","cart"],["G14","Clientes","users"]]},
    {g:"Estrutura", it:[["G15","Organograma","tree"],["G16","Pessoas e vínculos","id"]]},
    {g:"", it:[["G19","Relatórios","file"],["G18","Configurações","cog"]]}
  ],
  lider:[
    {g:"Equipe", it:[["L1","Painel da equipe","chart"],["L2","Ranking da equipe","trophy"],["L3","Performance","users"],["L4","Comissões da equipe","wallet"]]},
    {g:"Minha remuneração", it:[["L5","Comissão de liderança","wallet"]]},
    {g:"", it:[["L6","Organograma","tree"],["L7","Minha área de consultora","id"]]}
  ],
  assistente:[
    {g:"Lançamentos", it:[["A1","Início","home"],["A2","Nova venda","plus"]]},
    {g:"Operação", it:[["A5","Vendas","cart"],["A8","Clientes","users"],["A7","Parcelas","wallet"],["A9","Aniversariantes","cal"],["AG","Grupos","layers"]]},
    {g:"", it:[["C6","Simuladores","calc"]]}
  ],
  consultor:[
    {g:"", it:[["C1","Meu painel","home"],["C2","Minhas vendas","cart"],["C3","Minhas comissões","wallet"],["C4","Meus clientes","users"],["C5","Ranking","trophy"]]},
    {g:"Atendimento", it:[["C8","Mapa de cotas","layers"],["C6","Simuladores","calc"]]},
    {g:"Vínculos", it:[["C7","Minhas unidades","id"]]}
  ]
};
const PERFIS = {
  gestao:    {nome:"Gestão",     user:"Ricardo Menezes", ini:"RM", home:"G1", extra:""},
  lider:     {nome:"Líder",      user:"Camila Duarte",   ini:"CD", home:"L1", extra:"Equipe Camila Duarte"},
  assistente:{nome:"Assistente", user:"Júlia Ferreira",  ini:"JF", home:"A1", extra:""},
  consultor: {nome:"Consultor",  user:"Ana Martins",     ini:"AM", home:"C1", extra:""}
};
const ST = {perfil:"gestao", unidade:"con", screen:"MAPA", cota:1, step:1, tab:null, eq:null, somar:null,
  grupo:"1478", cotaSel:null, catf:null, reserva:null, tv:false, tvSlide:0, menu:null};
const perfilDe = id => id==="TV" ? "gestao" : ({G:"gestao",L:"lider",A:"assistente",C:"consultor"}[id[0]] || ST.perfil);

function sidebar(){
  const p=PERFIS[ST.perfil], un=D.unidades.find(u=>u.id===ST.unidade);
  return `<aside class="sb">
    <div class="sb-brand"><span class="mk">A</span><div><b>ademicon</b><span>plataforma unificada</span></div></div>
    <div class="sb-ctx"><div class="l">Unidade</div><div class="v">${un.nome}</div>
      <div class="l" style="margin-top:7px">Perfil ativo</div><div class="v">${p.nome}${p.extra?` · ${p.extra.replace("Equipe ","")}`:""}</div></div>
    <nav>${NAV[ST.perfil].map(sec=>`${sec.g?`<div class="grp">${sec.g}</div>`:'<div style="height:8px"></div>'}
      ${sec.it.map(([id,l,i])=>`<a class="it ${ST.screen===id?"on":""}" data-go="${id}">${ic(i,16)}<span>${l}</span></a>`).join("")}`).join("")}
    </nav>
    <div class="sb-foot">${avatar(p.ini)}<div style="flex:1"><div class="nm">${p.user}</div><div class="rl">${p.nome}</div></div>
      <button class="btn sm gh" data-screen="LOGIN" title="sair" style="color:#7A7A84">⏻</button></div>
  </aside>`;
}
function topbar(sc){
  const p=PERFIS[ST.perfil], un=D.unidades.find(u=>u.id===ST.unidade);
  const multiUnidade = ST.perfil==="consultor";
  const multiPerfil  = ST.perfil==="lider"||ST.perfil==="consultor";
  return `<header class="tb">
    <div><h1>${sc.t||""}${p.extra&&ST.perfil==="lider"?` · <span style="color:var(--red)">${p.extra}</span>`:""}</h1>
      ${sc.s?`<div class="sub">${sc.s}</div>`:""}</div>
    <span class="spacer"></span>
    ${["G1","G2","G3","G4","G5","G6"].includes(ST.screen)?`<button class="btn dark" data-tv="open">${ic("tv",15)} Modo apresentação</button>`:""}
    <div class="sel" data-menu="uni"><span class="dot"></span>${un.nome}<span class="cr">▾</span>
      ${ST.menu==="uni"?`<span class="menu"><span class="mh">${D.grupo}</span>
        ${D.unidades.map(u=>`<button class="${u.id===ST.unidade?"on":""}" data-set="unidade=${u.id}">${u.nome}
          <span class="mi-s">${u.id==="con"?"Ricardo Menezes":"Marcos Tavares"}</span></button>`).join("")}
        ${multiUnidade?`<hr><span class="mh">Vínculos de Ana Martins</span><button data-go="C7">Ver as duas unidades</button>`:
          `<hr><button data-screen="UNI">Ver tela de seleção de unidade</button>`}</span>`:""}</div>
    <div class="sel" data-menu="perf">${avatar(p.ini)}<span>${p.nome}${multiPerfil?" ▾":""}</span>
      ${ST.menu==="perf"?`<span class="menu"><span class="mh">${p.user}</span>
        ${(ST.perfil==="lider"||ST.perfil==="consultor")&&p.user==="Camila Duarte"?"":""}
        ${ST.perfil==="lider"?`<button class="on">Líder <span class="mi-s">equipe de 4 vendedores</span></button>
          <button data-profile="consultor">Consultor <span class="mi-s">as vendas dela, meta ${brl0(800000)}</span></button>`:""}
        ${ST.perfil==="consultor"?`<button class="on">Consultor <span class="mi-s">Concórdia · meta ${brl0(1500000)}</span></button>
          <button data-go="C7">Consultor <span class="mi-s">Joaçaba · meta ${brl0(400000)}</span></button>`:""}
        ${ST.perfil==="gestao"?`<button class="on">Gestão <span class="mi-s">único perfil nesta unidade</span></button>`:""}
        ${ST.perfil==="assistente"?`<button class="on">Assistente <span class="mi-s">único perfil nesta unidade</span></button>`:""}
        <hr><button data-go="MAPA">Mapa do protótipo</button><button data-screen="LOGIN">Sair</button></span>`:""}</div>
  </header>`;
}
function render(){
  const sc = SC[ST.screen] || SC.MAPA;
  const app = document.getElementById("app");
  /* barra do protótipo */
  document.getElementById("proto").innerHTML = `
    <span class="pt">Protótipo</span><span class="sep"></span>
    ${Object.entries(PERFIS).map(([k,v])=>`<button class="pbtn ${ST.perfil===k&&!sc.full?"on":""}" data-profile="${k}">${v.nome}</button>`).join("")}
    <span class="sep"></span>
    <button class="pbtn ${ST.screen==="MAPA"?"on":""}" data-screen="MAPA">Mapa das telas</button>
    <button class="pbtn ${ST.screen==="CMP"?"on":""}" data-screen="CMP">Comparação de perfis</button>
    <button class="pbtn ${ST.screen==="MOB"?"on":""}" data-screen="MOB">Mobile</button>
    <button class="pbtn" data-tv="open">Apresentação</button>
    <button class="pbtn ${ST.screen==="LOGIN"?"on":""}" data-screen="LOGIN">Login</button>
    <span class="spacer"></span>
    <span class="ref">${ST.screen} · dados fictícios · referência 15/09/2026</span>`;
  if(sc.full){ app.innerHTML = sc.r(); }
  else {
    app.innerHTML = `<div class="shell">${sidebar()}<div class="main">${topbar(sc)}
      <div class="wrap" style="${sc.wide?"max-width:1600px":""}">${sc.r()}</div></div></div>`;
  }
  renderTV();
  window.scrollTo(0,0);
}
function goTo(id){
  if(id==="TV"){ ST.tv=true; ST.tvSlide=0; render(); return; }
  if(SC[id]){
    const np=perfilDe(id);
    if(!SC[id].full && np!==ST.perfil && !["MAPA","CMP","MOB","NP","EMPTY"].includes(id)) ST.perfil=np;
    ST.screen=id; ST.menu=null; ST.step=1; ST.cota=1; ST.tab=null;
    render();
  }
}
document.addEventListener("click", e=>{
  const T = s => e.target.closest(s);
  let el;
  if(el=T("[data-tv]")){
    const a=el.dataset.tv;
    if(a==="open"){ST.tv=true;ST.tvSlide=0;}
    if(a==="close")ST.tv=false;
    if(a==="next")ST.tvSlide=Math.min(TV_SLIDES.length-1,(ST.tvSlide||0)+1);
    if(a==="prev")ST.tvSlide=Math.max(0,(ST.tvSlide||0)-1);
    render(); return;
  }
  if(el=T("[data-enter]")){ ST.unidade=el.dataset.enter; ST.perfil="consultor"; ST.screen="C1"; render(); return; }
  if(el=T("[data-profile]")){
    ST.perfil=el.dataset.profile;
    const go=el.dataset.go;
    ST.screen = go && SC[go] ? go : PERFIS[ST.perfil].home;
    ST.menu=null; ST.cota=1; ST.tab=null; render(); return;
  }
  if(el=T("[data-screen]")){ ST.screen=el.dataset.screen; ST.menu=null; render(); return; }
  if(el=T("[data-go]")){ goTo(el.dataset.go); return; }
  if(el=T("[data-set]")){
    const [k,v]=el.dataset.set.split("=");
    ST[k]= v===""?null:v; ST.menu=null; render(); return;
  }
  if(el=T("[data-cota]")){ ST.cota=+el.dataset.cota; render(); return; }
  if(el=T("[data-step]")){ ST.step=+el.dataset.step; render(); return; }
  if(el=T("[data-menu]")){ const m=el.dataset.menu; ST.menu = ST.menu===m?null:m; render(); return; }
  if(el=T("[data-exp]")){ document.getElementById(el.dataset.exp)?.classList.toggle("hide"); return; }
  if(ST.menu){ ST.menu=null; render(); }
});
document.addEventListener("keydown", e=>{
  if(!ST.tv) return;
  if(e.key==="ArrowRight"||e.key===" "){ST.tvSlide=Math.min(TV_SLIDES.length-1,(ST.tvSlide||0)+1);renderTV();}
  if(e.key==="ArrowLeft"){ST.tvSlide=Math.max(0,(ST.tvSlide||0)-1);renderTV();}
  if(e.key==="Escape"){ST.tv=false;renderTV();}
});
render();
</script>
</body>
</html>
